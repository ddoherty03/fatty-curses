name: windows

on:
  push:
    branches: [main, preserve-screen-suspension]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        ruby: [ 'mingw', 'mswin', '3.4' ]
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Build package
      run: bundle exec rake build
    - name: Install package
      run: |
        gem install pkg/fatty-curses-*.gem
        ruby -r fatty-curses -e 'abort unless Curses.respond_to?(:endwin); puts Curses::VERSION'
