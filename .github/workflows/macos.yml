name: macos

on:
  push:
    branches: [main, preserve-screen-suspension]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.4
    - name: Install dependencies
      run: |
        gem install bundler --no-document
        bundle install
    - name: Build package
      run: bundle exec rake build
    - name: Install package
      run: |
        gem install pkg/fatty-curses-*.gem
        ruby -r fatty-curses -e 'abort unless Curses.respond_to?(:endwin); puts Curses::VERSION'
