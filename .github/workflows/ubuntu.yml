name: ubuntu

on:
  push:
    branches: [main, preserve-screen-suspension]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        ruby: [ head, 3.4, 3.3, 3.2 ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
    - name: Install dependencies
      run: |
        sudo apt install libncursesw5-dev
        gem install bundler --no-document
        bundle install
    - name: Build package
      run: bundle exec rake build
    - name: Install package
      run: |
        gem install pkg/fatty-curses-*.gem
        ruby -r fatty-curses -e 'abort unless Curses.respond_to?(:endwin); puts Curses::VERSION'
